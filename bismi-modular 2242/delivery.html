<!DOCTYPE html>

<html lang="pt">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>Bismi Treats — Entrega</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F7F7F8;--white:#FFFFFF;--black:#111111;--text:#1A1A1A;--text2:#555555;--text3:#999999;--border:#E5E5E5;--accent:#C9A96E;--accent2:#A07840;--accent-pale:#FBF7EF;--accent-light:#F5EDD8;--success:#16A34A;--warning:#D97706;--danger:#DC2626;--info:#2563EB;--font:'Inter',system-ui,sans-serif;--radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.role-badge{background:#fff7ed;color:var(--warning);padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;border:1px solid #fed7aa}
.user-name{font-weight:600;color:var(--black);font-size:0.9rem}
.btn-logout{background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.78rem;font-family:var(--font);display:flex;align-items:center;gap:5px;transition:all .15s}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}
.filters{padding:10px 16px;background:var(--white);border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:0.78rem;font-family:var(--font);transition:all .15s;font-weight:500}
.filter-btn.active{background:var(--warning);border-color:var(--warning);color:white;font-weight:600}
.order-count-badge{background:var(--accent-pale);border:1px solid var(--accent-light);color:var(--accent2);padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;margin-left:auto}
.orders-container{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.delivery-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.card-header{padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.order-id-badge{font-weight:700;font-size:0.8rem;color:var(--accent2);background:var(--accent-pale);padding:2px 8px;border-radius:10px;border:1px solid var(--accent-light)}
.customer-name{font-weight:600;font-size:0.85rem;color:var(--black)}
.status-badge{font-size:0.7rem;font-weight:700;padding:3px 9px;border-radius:20px}
.card-body{padding:12px}
.info-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:0.82rem}
.info-row i{color:var(--accent);width:16px;flex-shrink:0;margin-top:2px;font-size:0.75rem}
.info-row .value{color:var(--text);font-weight:500;flex:1;line-height:1.4}
.price-highlight{background:var(--accent-pale);border:1.5px solid var(--accent-light);border-radius:var(--radius);padding:10px;text-align:center;margin-top:8px}
.price-amount{font-size:1.2rem;font-weight:700;color:var(--accent2)}
.price-method{font-size:0.75rem;color:var(--text3);margin-top:2px}
.card-actions{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;background:#fafafa}
.btn-action{border:none;padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.75rem;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:var(--font)}
.btn-delivered{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;flex:1;justify-content:center}
.btn-delivered:hover{background:var(--success);color:white}
.btn-wa{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
.btn-wa:hover{background:var(--success);color:white}
.btn-maps{background:#eff6ff;color:var(--info);border:1px solid #bfdbfe}
.btn-maps:hover{background:var(--info);color:white}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);grid-column:1/-1}
.empty-state i{font-size:3rem;margin-bottom:16px;display:block;opacity:.3;color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:white;padding:10px 16px;border-radius:var(--radius);font-size:0.82rem;font-weight:500;z-index:9999;transform:translateX(120%);transition:transform .3s;max-width:280px}
.toast.show{transform:translateX(0)}.toast.success{background:var(--success)}.toast.info{background:var(--info)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:600px){.orders-container{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="notifBanner" style="background:linear-gradient(135deg,rgba(201,169,110,.15),rgba(255,255,255,.8));border:1px solid rgba(201,169,110,.3);border-radius:10px;padding:10px 14px;margin:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.8rem;color:#6a4a1a">
  <div><strong>🔔 Enable Notifications</strong><br/><span style="font-size:.72rem;opacity:.8">Get sound alerts + lock screen notifications for new orders</span></div>
  <button onclick="requestNotifPermission();document.getElementById('notifBanner').style.display='none'" style="background:linear-gradient(135deg,#C9A96E,#A07840);color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:600;font-family:inherit;white-space:nowrap">Enable</button>
</div>

<div class="topbar">
<div style="display:flex;align-items:center;gap:10px">
<span style="font-size:1.2rem">🚚</span>
<div>
<div class="user-name" id="userName">Entrega</div>
<div class="role-badge">🚚 Entrega</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<span id="lastUpdate" style="font-size:0.7rem;color:var(--text3)">A atualizar...</span>
<button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
</div>
</div>
<div class="filters">
<button class="filter-btn active" onclick="setFilter('ready',this)">Prontas</button>
<button class="filter-btn" onclick="setFilter('today',this)">Hoje</button>
<button class="filter-btn" onclick="setFilter('future',this)">Futuras</button>
<button class="filter-btn" onclick="setFilter('delivered',this)">Entregues</button>
<span class="order-count-badge" id="orderCountBadge">0 encomendas</span>
</div>
<div class="orders-container" id="ordersContainer">
<div class="empty-state"><i class="fas fa-truck"></i><p>A carregar encomendas...</p></div>
</div>
<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script src="script.js"></script>
<script>
// ── NOTIFICATION & SOUND SYSTEM ──────────────────────────────
var _knownOrderIds = null;
var _notifPermission = 'default';
var _audioCtx = null;

// Request notification permission on load
function requestNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'granted'){
    _notifPermission = 'granted';
  } else if(Notification.permission !== 'denied'){
    Notification.requestPermission().then(function(p){
      _notifPermission = p;
      if(p === 'granted'){
        showToast('Notifications enabled! You will be alerted for new orders.', 'success');
      }
    });
  } else {
    _notifPermission = Notification.permission;
  }
}

// Play a chime sound using Web Audio API (no file needed)
function playOrderChime(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var ctx = _audioCtx;
    // Play 3 ascending tones
    var times = [0, 0.18, 0.36];
    var freqs = [523, 659, 784]; // C5, E5, G5
    times.forEach(function(t, i){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freqs[i];
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.35);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.4);
    });
  } catch(e){}
}

// Show lock screen / browser notification
function showOrderNotification(order){
  if(_notifPermission !== 'granted') return;
  try{
    var title = '🎂 New Order — Bismi Treats';
    var body = 'Order ' + (order.id||'') + '\n' +
      (order.customerName||'Customer') + '\n' +
      (order.cakeType||'') + ' · ' + (order.minWeight||'?') + '–' + (order.maxWeight||'?') + 'kg\n' +
      'Date: ' + (order.orderDate||'') + ' at ' + (order.orderTime||'');
    var notif = new Notification(title, {
      body: body,
      icon: '/favicon.ico',
      badge: '/favicon.ico',
      tag: 'bismi-order-' + (order.id||Date.now()),
      requireInteraction: true,
      vibrate: [200, 100, 200, 100, 200]
    });
    notif.onclick = function(){
      window.focus();
      notif.close();
    };
    setTimeout(function(){notif.close();}, 30000);
  } catch(e){}
}

// Check for new orders and alert
function checkForNewOrders(newOrders){
  if(_knownOrderIds === null){
    // First load — just record IDs, don't alert
    _knownOrderIds = new Set(newOrders.map(function(o){return o.id;}));
    return;
  }
  var newOnes = newOrders.filter(function(o){
    return !_knownOrderIds.has(o.id) && o.status === 'new';
  });
  if(newOnes.length > 0){
    // Update known IDs
    newOrders.forEach(function(o){_knownOrderIds.add(o.id);});
    // Play sound
    playOrderChime();
    // Show notification for each new order
    newOnes.forEach(function(o){
      showOrderNotification(o);
    });
    // Flash the page title
    var origTitle = document.title;
    var flashCount = 0;
    var flashInterval = setInterval(function(){checkForNewOrders(orders);
      document.title = flashCount % 2 === 0 ? '🔔 NEW ORDER! — Kitchen' : origTitle;
      flashCount++;
      if(flashCount > 10){ clearInterval(flashInterval); document.title = origTitle; }
    }, 600);
    // Show toast
    showToast('🎂 ' + newOnes.length + ' new order' + (newOnes.length > 1 ? 's' : '') + ' received!', 'success');
  } else {
    // Update known IDs for any new ones regardless of status
    newOrders.forEach(function(o){_knownOrderIds.add(o.id);});
  }
}


// Local aliases (in case script.js aliases not available)
var getCakeTypeName = typeof getCTName !== 'undefined' ? getCTName : function(id){return id||'—';};
var formatDate = typeof fmtDate !== 'undefined' ? fmtDate : function(d){if(!d)return '—';try{return new Date(d+'T00:00:00').toLocaleDateString('pt-PT');}catch(e){return d;}};

var session = AUTH.checkSession();
if (!session || session.role !== 'delivery') window.location.href = 'login.html';
document.getElementById('userName').textContent = session ? session.name : 'Entrega';

var currentFilter = 'ready';

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderDeliveryOrders();
}

function renderDeliveryOrders() {
  var doRender = function(){
    var now = today();
    var list = orders.filter(function(o){
      if (currentFilter==='ready') return o.status==='ready';
      if (currentFilter==='today') return o.orderDate===now&&o.status!=='cancelled';
      if (currentFilter==='future') return o.orderDate>now&&o.status!=='delivered'&&o.status!=='cancelled';
      if (currentFilter==='delivered') return o.status==='delivered';
      return true;
    });
    list.sort(function(a,b){
      return ((a.orderDate||'')+(a.orderTime||'')).localeCompare((b.orderDate||'')+(b.orderTime||''));
    });
    document.getElementById('orderCountBadge').textContent = list.length+' encomenda'+(list.length!==1?'s':'');
    var container = document.getElementById('ordersContainer');
    if (list.length===0) {
      container.innerHTML='<div class="empty-state"><i class="fas fa-check-circle" style="color:var(--success);opacity:1"></i><p>Sem entregas nesta categoria</p></div>';
      return;
    }
    container.innerHTML = list.map(function(o){
      var sc = STATUS[o.status]||STATUS.new;
      var mapsUrl = o.address?'https://maps.google.com/?q='+encodeURIComponent(o.address):'#';
      var waMsg = '🌸 Olá '+o.customerName+'!\n\nO seu pedido já está a caminho 🚚\nEntrega em aproximadamente 30 minutos.\n\n📍 Morada: '+(o.address||'—')+'\n💰 Valor: €'+(o.finalPrice||'—')+'\n💳 Pagamento: '+(o.paymentMethod||'—')+'\n\nObrigado por escolher a Bismi Treats! 😊';
      var phone = (o.phone||'351934453710').replace(/\D/g,'');
      if (!phone.startsWith('351')) phone='351'+phone;
      var waUrl = 'https://wa.me/'+phone+'?text='+encodeURIComponent(waMsg);
      return '<div class="delivery-card">'
        +'<div class="card-header">'
          +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
            +'<span class="order-id-badge">'+(o.orderId||o.id)+'</span>'
            +'<span class="customer-name">'+o.customerName+'</span>'
          +'</div>'
          +'<span class="status-badge" style="background:'+sc.bg+';color:'+sc.color+'">'+sc.label+'</span>'
        +'</div>'
        +'<div class="card-body">'
          +'<div class="info-row"><i class="fas fa-phone"></i><span class="value">'+(o.phone||'—')+'</span></div>'
          +'<div class="info-row"><i class="fas fa-map-marker-alt"></i><span class="value">'+(o.address||'Recolha')+'</span></div>'
          +'<div class="info-row"><i class="fas fa-clock"></i><span class="value">'+formatDate(o.orderDate)+' às '+(o.orderTime||'—')+'</span></div>'
          +'<div class="info-row"><i class="fas fa-birthday-cake"></i><span class="value">'+getCakeTypeName(o.cakeType)+' · '+getWeightDesc(o)+'</span></div>'
          +'<div class="price-highlight">'
            +'<div class="price-amount">€'+(o.finalPrice||'—')+'</div>'
            +'<div class="price-method">'+(o.paymentMethod||'—')+'</div>'
          +'</div>'
        +'</div>'
        +'<div class="card-actions">'
          +(o.status!=='delivered'?'<button class="btn-action btn-delivered" onclick="markDelivered('+o.id+')"><i class="fas fa-check-circle"></i> Marcar Entregue</button>':'')
          +'<button class="btn-action btn-wa" onclick="window.open(\''+waUrl+'\',\'_blank\')"><i class="fab fa-whatsapp"></i></button>'
          +(o.address?'<button class="btn-action btn-maps" onclick="window.open(\''+mapsUrl+'\',\'_blank\')"><i class="fas fa-map"></i></button>':'')
        +'</div>'
      +'</div>';
    }).join('');
    document.getElementById('lastUpdate').textContent = 'Atualizado: '+new Date().toLocaleTimeString('pt-PT');
  };
  if(orders.length===0){loadData(doRender);}else{doRender();}
}

function markDelivered(orderId) {
  var order = orders.find(function(o){return o.id===orderId;});
  if (!order||!confirm('Marcar como entregue?')) return;
  order.status = 'delivered';
  order.deliveredAt = new Date().toISOString();
  saveOrder(order, function(){renderDeliveryOrders();showToast('✅ Entregue!','success');});
}

function showToast(msg, type) {
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},3500);
}

document.getElementById('logoutBtn').addEventListener('click', function(){AUTH.logout();window.location.href='login.html';});
requestNotifPermission();
  loadData(function(){renderDeliveryOrders();});
setInterval(function(){loadData(function(){renderDeliveryOrders();});}, 15000);
document.addEventListener('ordersUpdated', function(){renderDeliveryOrders();});
</script>
</body>
</html>
